apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: digital-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: your-registry.io/digital-wallet/app:latest
          command: ["node", "demo/server.js"]
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: wallet-secrets
            # Use demo-specific config so the browser receives external URLs,
            # not internal cluster service names
            - configMapRef:
                name: wallet-demo-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /demo/config
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: digital-wallet
spec:
  selector:
    app: demo
  ports:
    - port: 3004
      targetPort: 3004
