# Replace every value here before deploying.
# Generate keys with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: digital-wallet
type: Opaque
stringData:
  DB_ROOT_PASSWORD: "changeme-root-password"
  DB_PASSWORD:      "changeme-wallet-password"
  KMS_MASTER_KEY:   "changeme-32-byte-hex-master-key-here-0000000000000000"
  ADMIN_API_KEY:    "changeme-admin-api-key"
  DEFAULT_API_KEY:  "changeme-default-api-key"
